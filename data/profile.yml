about: |
        I am a second-year undergraduate student in Computer Science at National Yang Ming Chiao Tung University (NYCU). I am currently working as a Project Management Intern at MediaTek.

        My interests include computer vision, algorithms, and competitive programming. I am also a member of the Computational Photography Lab, advised by [Prof. Yu-Lun Liu](https://yulunalexliu.github.io), where I am exploring research topics related to computer vision and computational photography.

